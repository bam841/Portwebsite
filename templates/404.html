{% extends "base.html" %}

{% block title %}Page Not Found — {{ profile.name }}{% endblock %}

{% block content %}
<div class="relative w-full max-w-[800px] my-auto bg-slate-900 rounded-[32px] p-12 text-center text-white border border-white/10 shadow-2xl">
  <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-orange-600/20 text-orange-500 flex items-center justify-center font-black text-2xl">
    404
  </div>
  <h1 class="text-3xl font-black mb-3">Page Not Found</h1>
  <p class="text-slate-400 max-w-md mx-auto mb-8">
    The page or route you are looking for does not exist or has been moved.
  </p>
  <a href="{{ url_for('index') }}" class="inline-flex items-center gap-2 bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs uppercase tracking-wider px-6 py-3.5 rounded-full transition shadow-lg">
    <span>← Back to Home</span>
  </a>
</div>
{% endblock %}
